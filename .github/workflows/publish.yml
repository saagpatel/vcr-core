name: Publish to PyPI
# Trusted-publisher (OIDC) release: push a v* tag to build and publish. No stored
# token — PyPI must have a trusted publisher configured for this repo + this
# workflow filename + the `pypi` environment before the first tagged run.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      # `dev` is a dependency-group, not an extra: `uv sync --extra dev` fails outright,
      # and `uv sync` already installs the default dev group.
      - run: uv sync
      - run: uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1 (2026-10-05)
