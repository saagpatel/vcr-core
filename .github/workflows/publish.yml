name: Publish to PyPI
# Trusted-publisher (OIDC) release: push a v* tag to build and publish. No stored
# token — PyPI must have a trusted publisher configured for this repo + this
# workflow filename + the `pypi` environment before the first tagged run.
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      # `dev` is a dependency-group, not an extra: `uv sync --extra dev` fails outright,
      # and `uv sync` already installs the default dev group.
      - run: uv sync
      - run: uv run pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
