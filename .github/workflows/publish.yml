name: Publish to PyPI
# Trusted-publisher (OIDC) release: push a v* tag to build and publish. No stored
# token — PyPI must have a trusted publisher configured for this repo + this
# workflow filename + the `pypi` environment before the first tagged run.
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra dev
      - run: uv run --extra dev pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
