name: Publish to PyPI
# Trusted-publisher (OIDC) release: push a v* tag to build and publish. No stored
# token — PyPI must have a trusted publisher configured for this repo + this
# workflow filename + the `pypi` environment before the first tagged run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.0
      - name: Verify tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: python -c 'import os, tomllib; from pathlib import Path; version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]; expected = f"v{version}"; actual = os.environ["TAG_NAME"]; assert actual == expected, f"tag {actual!r} does not match package version {expected!r}"'
      - run: uv sync --locked
      - run: uv run --locked pytest -q
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
