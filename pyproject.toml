[project]
name = "vcr-core"
version = "0.2.0"
description = "The shared spine for the Verified-Check Record (VCR v0.1) program: schema, verdict vocabulary, record builder, and the EES metric. Imported by The Enforcement Gap (N2) and HarnessBench."
readme = "README.md"
requires-python = ">=3.12"
# Pure-stdlib core so zero-third-party-dep consumers (HarnessBench) can import the spine.
dependencies = []

[project.optional-dependencies]
validate = ["jsonschema>=4.21"]

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vcr_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
