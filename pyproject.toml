[project]
name = "vcr-core"
version = "0.2.0"
description = "The shared spine for the Verified-Check Record (VCR v0.1) program: schema, verdict vocabulary, record builder, and the EES metric. Imported by The Enforcement Gap (N2) and HarnessBench."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "vcr-core maintainers" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
# Pure-stdlib core so zero-third-party-dep consumers can import the spine.
dependencies = []

[project.urls]
Documentation = "https://saagarpatel.dev/schema/vcr/v0.1"

[project.optional-dependencies]
validate = ["jsonschema>=4.21"]

[dependency-groups]
dev = ["vcr-core[validate]", "pytest>=9.1.1", "ruff>=0.17.0", "mypy>=2.4.0"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vcr_core"]

[tool.hatch.build.targets.sdist]
include = ["vcr_core/", "tests/", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
required-version = "==0.13.0"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "TC", "UP"]

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.mypy]
python_version = "3.12"
strict = true
files = ["vcr_core", "tests"]

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true
